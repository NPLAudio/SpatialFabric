name: Standalone OSC Controller

on:
  push:
    paths:
      - 'Apps/OSCController/**'
      - 'Examples/OSCSceneQuery/**'
      - '.github/workflows/osc-controller.yml'
  pull_request:
    paths:
      - 'Apps/OSCController/**'
      - 'Examples/OSCSceneQuery/**'
      - '.github/workflows/osc-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Protocol, profile and actual loopback tests
        working-directory: Apps/OSCController
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node scene client and host-wrapper examples
        run: node --test Examples/OSCSceneQuery/test_scene_query.js

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build-only dependency
        working-directory: Apps/OSCController
        run: python -m pip install -r requirements-build.txt
      - name: Build portable executable and ZIP
        working-directory: Apps/OSCController
        run: python build_windows.py
      - name: Packaged no-network startup smoke
        working-directory: Apps/OSCController
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'osc-controller-smoke.json'
          Start-Process -FilePath '.\dist\SpatialFabricOSCController.exe' -ArgumentList @('--smoke-test', $report) -Wait
          if (-not (Test-Path $report)) { throw 'Packaged startup produced no report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Packaged startup smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialFabricOSCController-Windows-x64
          path: Apps/OSCController/dist/SpatialFabricOSCController-Windows-x64.zip
          if-no-files-found: error
